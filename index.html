<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socrata Datasets</title>
<style>
  body { font: 14px/1.4 -apple-system, system-ui, sans-serif; margin: 16px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #status { color: #666; margin-bottom: 6px; }
  #reset { font-size: 13px; margin-bottom: 12px; }
  /* Filter control changed from its default. The box-shadow also shows on native
     selects, which some browsers render without the background color. */
  .active { background: #fff3a0; box-shadow: 0 0 0 2px #f2d200; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #e3e3e3; vertical-align: top; text-align: left; }
  thead { position: sticky; top: 0; z-index: 1; }
  th { background: #f6f6f6; white-space: nowrap; }
  tr.min-row th { padding-top: 0; font-weight: normal; }
  tr.min-row input { width: 100%; min-width: 70px; box-sizing: border-box; font-size: 12px; }
  tr.min-row th.num input { text-align: right; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { background: #ececec; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.domain { white-space: nowrap; font-size: 13px; color: #555; }
  td.name a { font-weight: 600; }
  td.name .desc { color: #555; font-size: 13px; }
  td.name .freq { color: #888; font-size: 12px; margin-top: 2px; }
  tbody tr:hover { background: #fafafa; }
  #controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 16px; margin-bottom: 12px; }
  #filters { display: contents; }
  #controls label { display: flex; flex-direction: column; font-size: 12px; color: #555; gap: 2px; }
  #controls select { max-width: 300px; font-size: 13px; }
  #search { width: 240px; font-size: 13px; }
  #tagpicker { position: relative; display: flex; flex-direction: column; font-size: 12px; color: #555; gap: 2px; }
  #tags-btn { width: 220px; font-size: 13px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tags-panel { position: absolute; top: 100%; left: 0; right: 0; z-index: 10; padding: 6px;
    background: #fff; border: 1px solid #ccc; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  #tags-panel input[type=search] { width: 100%; box-sizing: border-box; font-size: 13px; }
  #tag-list { max-height: 320px; overflow-y: auto; margin-top: 6px; }
  #controls #tag-list label { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: #222; padding: 1px 0; }
</style>
</head>
<body>
<h1>Chicago, Cook County &amp; Illinois datasets</h1>
<div id="controls">
  <label>Search name &amp; description<input id="search" type="search" placeholder="e.g. permits"></label>
  <!-- Rebuilt on every filter change; kept separate so the search box keeps focus. -->
  <div id="filters"></div>
  <div id="tagpicker">
    Tags (any of)
    <button id="tags-btn" type="button">All</button>
    <div id="tags-panel" hidden>
      <input id="tag-search" type="search" placeholder="Find a tag">
      <div id="tag-list"></div>
    </div>
  </div>
</div>
<div id="status">Loading…</div>
<button id="reset" type="button">Reset</button>
<table>
  <thead>
    <tr>
      <th>Dataset</th>
      <th class="sortable" data-key="domain">Domain</th>
      <th class="sortable" data-key="createdAt">Created</th>
      <th class="sortable" data-key="updatedAt">Updated</th>
      <th class="sortable num" data-key="viewsLastMonth">Views (last month)</th>
      <th class="sortable num" data-key="viewsTotal">Views (total)</th>
      <th class="sortable num" data-key="downloads">Downloads</th>
      <th class="sortable num" data-key="numColumns">Columns</th>
    </tr>
    <tr class="min-row">
      <th></th>
      <th></th>
      <th><input type="number" min="0" data-min="createdAt" placeholder="≤ days ago" title="Created within the last N days"></th>
      <th><input type="number" min="0" data-min="updatedAt" placeholder="≤ days ago" title="Updated within the last N days"></th>
      <th class="num"><input type="number" min="0" data-min="viewsLastMonth" placeholder="≥" title="At least N views last month"></th>
      <th class="num"><input type="number" min="0" data-min="viewsTotal" placeholder="≥" title="At least N total views"></th>
      <th class="num"><input type="number" min="0" data-min="downloads" placeholder="≥" title="At least N downloads"></th>
      <th class="num"><input type="number" min="0" data-min="numColumns" placeholder="≥" title="At least N columns"></th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
<script>
const API = 'https://api.us.socrata.com/api/catalog/v1';
const PAGE = 1000;

// Each portal stores owner/frequency under its own custom metadata keys; the first
// non-empty key wins. ATTRIBUTION is the standard Socrata resource.attribution field.
const ATTRIBUTION = '(attribution)';
const DOMAINS = {
  'data.cityofchicago.org': {
    label: 'Chicago',
    owner: ['Metadata_Data-Owner'],
    frequency: ['Metadata_Frequency'],
  },
  'datacatalog.cookcountyil.gov': {
    label: 'Cook County',
    owner: ['Department_Publishing-Department', ATTRIBUTION],
    frequency: ['Metadata_Update-Frequency', 'Publishing-Details_Publishing-frequency'],
  },
  'data.illinois.gov': {
    label: 'Illinois',
    owner: ['Organizations_Organization'],
    frequency: [],
  },
};

const NONE = '(none)';
const FREQUENCIES = ['Daily', 'Weekly', 'Monthly', 'Other'];
const FACETS = [
  { key: 'domain', label: 'Domain' },
  { key: 'owner', label: 'Data Owner' },
  { key: 'frequency', label: 'Frequency', order: FREQUENCIES },
  { key: 'category', label: 'Category' },
];

let rows = [];
let fetchedAt = '';
let sortKey = 'viewsLastMonth';
let sortDir = -1; // -1 desc, 1 asc
const filters = Object.fromEntries(FACETS.map(f => [f.key, ''])); // '' = all
let searchTerms = []; // lowercased words; a row must contain all of them
const selectedTags = new Set(); // a row must have at least one of them
// key -> threshold. Numeric keys: value >= N. Date keys: within the last N days.
const minFilters = {};
const DATE_KEYS = new Set(['createdAt', 'updatedAt']);
const DAY_MS = 24 * 60 * 60 * 1000;

// One request series per domain: search_context must be the dataset's own domain,
// or the API omits its domain_category, domain_tags and domain_metadata.
async function fetchDomain(domain) {
  const out = [];
  for (let offset = 0; ; offset += PAGE) {
    const params = new URLSearchParams({
      domains: domain, search_context: domain, only: 'dataset',
      limit: PAGE, offset,
    });
    const res = await fetch(`${API}?${params}`);
    if (!res.ok) throw new Error(`${domain}: HTTP ${res.status}`);
    const data = await res.json();
    out.push(...data.results);
    if (data.results.length < PAGE || out.length >= data.resultSetSize) break;
  }
  return out;
}

async function fetchAll() {
  const results = (await Promise.all(Object.keys(DOMAINS).map(fetchDomain))).flat();
  return results.map(r => {
    const domain = r.metadata.domain;
    const meta = Object.fromEntries(
      (r.classification?.domain_metadata || []).map(m => [m.key, m.value]));
    meta[ATTRIBUTION] = r.resource.attribution;
    const firstOf = keys => keys.map(k => (meta[k] || '').trim()).find(Boolean) || '';
    const frequencyRaw = firstOf(DOMAINS[domain].frequency);
    const description = stripHtml(r.resource.description || '');
    return {
      domain: DOMAINS[domain].label,
      name: r.resource.name,
      link: r.link || r.permalink,
      description,
      searchText: `${r.resource.name} ${description}`.toLowerCase(),
      createdAt: r.resource.createdAt,
      updatedAt: r.resource.updatedAt,
      viewsLastMonth: r.resource.page_views?.page_views_last_month ?? 0,
      viewsTotal: r.resource.page_views?.page_views_total ?? 0,
      downloads: r.resource.download_count ?? 0,
      // Exclude hidden auto-generated geo columns (:@computed_region_*).
      numColumns: (r.resource.columns_field_name || []).filter(f => !f.startsWith(':')).length,
      owner: facetValue(firstOf(DOMAINS[domain].owner)),
      frequency: normalizeFrequency(frequencyRaw),
      frequencyRaw,
      category: facetValue(r.classification?.domain_category),
      tags: [...new Set((r.classification?.domain_tags || [])
        .map(t => t.trim().toLowerCase()).filter(Boolean))],
    };
  });
}

const facetValue = v => (v || '').trim() || NONE;

// Collapse free-text Metadata_Frequency into FREQUENCIES. Checked in order, so
// "updated daily. Lobbyist reporting is quarterly." is Daily. Sub-daily (hourly)
// counts as Daily; discontinued datasets and missing values are Other.
function normalizeFrequency(raw) {
  const s = (raw || '').toLowerCase();
  if (/no longer|historical/.test(s)) return 'Other';
  if (/\bdaily\b|hour|per day/.test(s)) return 'Daily';
  if (/\bweekly\b/.test(s)) return 'Weekly';
  if (/\bmonthly\b|each month/.test(s)) return 'Monthly';
  return 'Other';
}

const meetsMin = (r, key, n) =>
  DATE_KEYS.has(key) ? Date.parse(r[key]) >= Date.now() - n * DAY_MS : r[key] >= n;

// Rows matching search + all active filters, optionally ignoring one facet (for its own option counts).
const matches = (r, ignore) =>
  searchTerms.every(t => r.searchText.includes(t)) &&
  Object.entries(minFilters).every(([key, n]) => meetsMin(r, key, n)) &&
  (ignore === 'tags' || !selectedTags.size || r.tags.some(t => selectedTags.has(t))) &&
  FACETS.every(f => f.key === ignore || !filters[f.key] || r[f.key] === filters[f.key]);

document.getElementById('search').addEventListener('input', e => {
  searchTerms = e.target.value.toLowerCase().split(/\s+/).filter(Boolean);
  renderFilters();
  render();
});

document.getElementById('reset').addEventListener('click', () => {
  document.getElementById('search').value = '';
  searchTerms = [];
  for (const key in filters) filters[key] = '';
  document.querySelectorAll('input[data-min]').forEach(input => { input.value = ''; });
  for (const key in minFilters) delete minFilters[key];
  selectedTags.clear();
  document.getElementById('tag-search').value = '';
  document.getElementById('tags-panel').hidden = true;
  renderFilters();
  render();
});

const tagPicker = document.getElementById('tagpicker');
const tagsPanel = document.getElementById('tags-panel');
document.getElementById('tags-btn').addEventListener('click', () => {
  tagsPanel.hidden = !tagsPanel.hidden;
  if (!tagsPanel.hidden) document.getElementById('tag-search').focus();
});
document.addEventListener('click', e => { if (!tagPicker.contains(e.target)) tagsPanel.hidden = true; });
tagPicker.addEventListener('keydown', e => { if (e.key === 'Escape') tagsPanel.hidden = true; });
document.getElementById('tag-search').addEventListener('input', renderTagList);

// Tag options with counts among rows matching every other active filter. The tag
// selection itself is ignored, since adding a tag (OR) only ever widens the results.
function renderTagList() {
  const counts = new Map();
  for (const r of rows) {
    if (!matches(r, 'tags')) continue;
    for (const t of r.tags) counts.set(t, (counts.get(t) || 0) + 1);
  }
  for (const t of selectedTags) if (!counts.has(t)) counts.set(t, 0);
  const query = document.getElementById('tag-search').value.trim().toLowerCase();
  const tags = [...counts.keys()]
    .filter(t => selectedTags.has(t) || t.includes(query))
    .sort((a, b) => selectedTags.has(b) - selectedTags.has(a) ||
      counts.get(b) - counts.get(a) || a.localeCompare(b));

  document.getElementById('tag-list').replaceChildren(...tags.map(t => {
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = selectedTags.has(t);
    box.addEventListener('change', () => {
      if (box.checked) selectedTags.add(t); else selectedTags.delete(t);
      renderFilters();
      render();
    });
    const label = document.createElement('label');
    label.append(box, `${t} (${counts.get(t)})`);
    return label;
  }));

  document.getElementById('tags-btn').textContent =
    selectedTags.size ? [...selectedTags].join(', ') : 'All';
}

document.querySelectorAll('input[data-min]').forEach(input => {
  input.addEventListener('input', () => {
    const n = input.valueAsNumber;
    if (Number.isNaN(n)) delete minFilters[input.dataset.min];
    else minFilters[input.dataset.min] = n;
    renderFilters();
    render();
  });
});

function renderFilters() {
  renderTagList();
  const container = document.getElementById('filters');
  container.replaceChildren(...FACETS.map(f => {
    const counts = new Map();
    let total = 0;
    for (const r of rows) {
      if (!matches(r, f.key)) continue;
      counts.set(r[f.key], (counts.get(r[f.key]) || 0) + 1);
      total++;
    }
    if (filters[f.key] && !counts.has(filters[f.key])) counts.set(filters[f.key], 0);
    const values = [...counts.keys()].sort(f.order
      ? (a, b) => f.order.indexOf(a) - f.order.indexOf(b)
      : (a, b) => a === NONE ? 1 : b === NONE ? -1 : a.localeCompare(b));

    const select = document.createElement('select');
    select.append(new Option(`All (${total})`, ''),
      ...values.map(v => new Option(`${v} (${counts.get(v)})`, v)));
    select.value = filters[f.key];
    select.addEventListener('change', () => {
      filters[f.key] = select.value;
      renderFilters();
      render();
    });

    const label = document.createElement('label');
    label.append(f.label, select);
    return label;
  }));
}

// Some descriptions contain HTML; DOMParser doesn't execute scripts or load resources.
const stripHtml = s =>
  (new DOMParser().parseFromString(s, 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim();
const fmtDate = s => s ? s.slice(0, 10) : '';
const fmtNum = n => n.toLocaleString();
const snippet = s => s.length > 100 ? s.slice(0, 100) + '…' : s;

function render() {
  const filtered = rows.filter(r => matches(r));
  document.getElementById('status').textContent =
    `${filtered.length} of ${rows.length} datasets · fetched ${fetchedAt}`;

  const sorted = filtered.sort((a, b) =>
    (a[sortKey] < b[sortKey] ? -1 : a[sortKey] > b[sortKey] ? 1 : 0) * sortDir);

  const tbody = document.querySelector('tbody');
  tbody.replaceChildren(...sorted.map(r => {
    const tr = document.createElement('tr');

    const nameTd = document.createElement('td');
    nameTd.className = 'name';
    const a = document.createElement('a');
    a.href = r.link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = r.name;
    const desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = snippet(r.description);
    nameTd.append(a, desc);
    if (r.frequencyRaw) {
      const freq = document.createElement('div');
      freq.className = 'freq';
      freq.textContent = `Updated: ${r.frequencyRaw}`;
      nameTd.append(freq);
    }

    const cell = (text, cls) => {
      const td = document.createElement('td');
      td.className = cls;
      td.textContent = text;
      return td;
    };
    tr.append(
      nameTd,
      cell(r.domain, 'domain'),
      cell(fmtDate(r.createdAt), 'date'),
      cell(fmtDate(r.updatedAt), 'date'),
      cell(fmtNum(r.viewsLastMonth), 'num'),
      cell(fmtNum(r.viewsTotal), 'num'),
      cell(fmtNum(r.downloads), 'num'),
      cell(fmtNum(r.numColumns), 'num'),
    );
    return tr;
  }));

  document.querySelectorAll('th.sortable').forEach(th => {
    const label = th.textContent.replace(/ [▲▼]$/, '');
    th.textContent = th.dataset.key === sortKey ? `${label} ${sortDir < 0 ? '▼' : '▲'}` : label;
  });

  highlightActiveControls();
}

// Mark every filter control that differs from its default.
function highlightActiveControls() {
  document.getElementById('search').classList.toggle('active', searchTerms.length > 0);
  document.querySelectorAll('#filters select').forEach(s => s.classList.toggle('active', s.value !== ''));
  document.getElementById('tags-btn').classList.toggle('active', selectedTags.size > 0);
  document.querySelectorAll('input[data-min]').forEach(input =>
    input.classList.toggle('active', input.dataset.min in minFilters));
}

document.querySelectorAll('th.sortable').forEach(th => {
  th.addEventListener('click', () => {
    if (sortKey === th.dataset.key) sortDir = -sortDir;
    else { sortKey = th.dataset.key; sortDir = -1; }
    render();
  });
});

fetchAll()
  .then(data => {
    rows = data;
    fetchedAt = new Date().toLocaleString();
    renderFilters();
    render();
  })
  .catch(err => {
    document.getElementById('status').textContent = `Failed to load: ${err.message}`;
  });
</script>
</body>
</html>
